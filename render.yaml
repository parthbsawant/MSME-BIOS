# Render Blueprint for the MSME-BIOS backend API.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: msme-bios-api
    runtime: docker
    rootDir: backend/parser-backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-adminsdk.json
      - key: ENABLE_CLAUDE_VISION_BANK
        value: "false"
      - key: ENABLE_CLAUDE_VISION_INVOICE
        value: "false"
      - key: ENABLE_CLAUDE_VISION_HANDWRITTEN
        value: "false"
