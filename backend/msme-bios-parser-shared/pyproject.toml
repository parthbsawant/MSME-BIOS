[project]
name = "msme-bios-parser-shared"
version = "0.2.0"
description = "MSME-BIOS document parsers, consolidated: shared contract/Claude wrapper plus all three parsers (bank statement, invoice/bill, handwritten bill) and the pipeline that routes between them."
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.34.0",
    "pydantic>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pdfplumber>=0.10",
    "PyMuPDF>=1.23",
    "Pillow>=10.0",
    "pytesseract>=0.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["msme_bios_shared*", "bank_parser*", "invoice_parser*", "handwritten_parser*"]
